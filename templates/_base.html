<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <a href="{% url 'post_list' %}"><h1>Blog</h1></a>
    </header>
    <main></main>
        {% block content %}
        {% for publication in post_list %}
            <li>
                <h2>{{ publication.title }}</h2>
                <p>{{ publication.author.username }}</p>
            </li>
        {% endfor %}
{% endblock content %}
