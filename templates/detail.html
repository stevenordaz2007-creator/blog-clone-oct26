{% extends '_base.html' %}

{% block content %}
    <h1>Blog Post</h1>
    <h2>{{ post.title }}</h2>
    <p>By {{ post.author.username }}</p>
    <p>{{ post.content }}</p>
    <hr>
    {% if user.is_authenticated and user == post.author %}
    </div>
        <a href="{% url 'post_update' post.pk %}">Edit Post</a>
        <a href="{% url 'post_delete' post.pk %}">Delete Post</a>
    </div>
    {%endif %}
{% endblock content %}
